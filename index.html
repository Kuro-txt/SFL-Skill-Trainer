<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sunflower Land — Skill Matrix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen flex flex-col items-center p-2 selection:bg-amber-400 selection:text-black">

  <div class="max-w-4xl w-full flex flex-col gap-2">
    
    <!-- Ultra-Compact Mobile Header -->
    <header class="card-glass rounded-xl p-2.5 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="text-xl">🌻</span>
        <h1 class="font-display text-xs font-bold tracking-tight text-white">SFL SKILLS</h1>
      </div>

      <!-- Farm ID Search & Actions -->
      <div class="flex items-center gap-1.5 flex-grow justify-end">
        <form onsubmit="fetchFarmSkills(event)" class="flex items-center bg-slate-900/90 rounded-lg border border-slate-700/80 p-0.5 max-w-[170px] w-full">
          <span class="pl-1.5 text-slate-500 text-[10px]">#</span>
          <input 
            id="farm-id-input" 
            type="number" 
            placeholder="Farm ID" 
            class="w-full px-1.5 py-0.5 bg-transparent text-xs text-white placeholder-slate-500 focus:outline-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
            required 
          />
          <button id="fetch-btn" type="submit" class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-bold text-[10px] whitespace-nowrap">
            Sync
          </button>
        </form>

        <button type="button" onclick="openSuggestionsModal()" class="px-2 py-1 rounded-lg bg-amber-500/10 border border-amber-500/40 text-[10px] font-bold text-amber-300 whitespace-nowrap">
          Presets
        </button>

        <button type="button" onclick="resetCurrentCategory()" class="btn-secondary px-2 py-1 rounded-lg text-[10px] font-semibold text-slate-300">
          Reset
        </button>
      </div>
    </header>

    <!-- Category Pill Carousel (Horizontal Scroll) -->
    <nav id="category-tabs" class="flex gap-1 overflow-x-auto pb-1 scrollbar-none"></nav>

    <!-- Tier Filter Tabs (Prevents Long Scrolling) -->
    <div class="flex items-center justify-between gap-1 card-sub p-1 rounded-xl">
      <div id="tier-filter-buttons" class="flex gap-1">
        <button type="button" onclick="setTierFilter('all')" id="filter-all" class="px-2.5 py-1 rounded-lg text-[10px] font-bold transition bg-amber-400/20 text-amber-300">
          All Tiers
        </button>
        <button type="button" onclick="setTierFilter(1)" id="filter-1" class="px-2.5 py-1 rounded-lg text-[10px] font-bold transition text-slate-400 hover:text-white">
          Tier 1
        </button>
        <button type="button" onclick="setTierFilter(2)" id="filter-2" class="px-2.5 py-1 rounded-lg text-[10px] font-bold transition text-slate-400 hover:text-white">
          Tier 2
        </button>
        <button type="button" onclick="setTierFilter(3)" id="filter-3" class="px-2.5 py-1 rounded-lg text-[10px] font-bold transition text-slate-400 hover:text-white">
          Tier 3
        </button>
      </div>
      <span id="tab-tier-summary" class="text-[9px] font-pixel text-slate-400 pr-1.5">0 pts</span>
    </div>

    <!-- Main Workspace (Dynamic Tier Sections) -->
    <main class="flex flex-col gap-2">
      <!-- Tier 1 Section -->
      <section id="tier-1-section" class="card-glass rounded-xl p-2.5 flex flex-col gap-1.5">
        <div class="flex items-center justify-between pb-1 border-b border-slate-800/80">
          <span class="px-1.5 py-0.2 rounded bg-emerald-500/10 border border-emerald-500/30 text-[8px] font-pixel text-emerald-400">TIER 1</span>
          <span id="tier-1-status" class="text-[8px] font-pixel text-emerald-400">0 PTS</span>
        </div>
        <div id="tier-1-grid" class="grid grid-cols-2 gap-1.5"></div>
      </section>

      <!-- Tier 2 Section -->
      <section id="tier-2-section" class="card-glass rounded-xl p-2.5 flex flex-col gap-1.5">
        <div class="flex flex-col gap-1 pb-1 border-b border-slate-800/80">
          <div class="flex items-center justify-between">
            <span class="px-1.5 py-0.2 rounded bg-amber-500/10 border border-amber-500/30 text-[8px] font-pixel text-amber-400">TIER 2</span>
            <span id="tier-2-status" class="text-[8px] font-pixel text-slate-400">0/3 REQ</span>
          </div>
          <div class="w-full h-1 rounded-full bg-slate-900 overflow-hidden">
            <div id="tier-2-progress" class="h-full bg-amber-400 transition-all duration-200" style="width: 0%;"></div>
          </div>
        </div>
        <div id="tier-2-grid" class="grid grid-cols-2 gap-1.5"></div>
      </section>

      <!-- Tier 3 Section -->
      <section id="tier-3-section" class="card-glass rounded-xl p-2.5 flex flex-col gap-1.5">
        <div class="flex flex-col gap-1 pb-1 border-b border-slate-800/80">
          <div class="flex items-center justify-between">
            <span class="px-1.5 py-0.2 rounded bg-purple-500/10 border border-purple-500/30 text-[8px] font-pixel text-purple-400">TIER 3</span>
            <span id="tier-3-status" class="text-[8px] font-pixel text-slate-400">0/7 REQ</span>
          </div>
          <div class="w-full h-1 rounded-full bg-slate-900 overflow-hidden">
            <div id="tier-3-progress" class="h-full bg-purple-400 transition-all duration-200" style="width: 0%;"></div>
          </div>
        </div>
        <div id="tier-3-grid" class="grid grid-cols-2 gap-1.5"></div>
      </section>
    </main>

  </div>

  <!-- Sticky Bottom Mobile App Dock -->
  <div class="fixed bottom-0 inset-x-0 z-40 bg-slate-950/95 border-t border-slate-800/80 backdrop-blur-md p-2 flex justify-center">
    <div class="max-w-4xl w-full flex items-center justify-between gap-2">
      
      <!-- Investment Summary Badges -->
      <div class="flex items-center gap-1.5">
        <div class="card-sub px-2 py-1 rounded-lg flex items-center gap-1">
          <span class="text-[9px] text-slate-400 uppercase">Pts</span>
          <span id="dock-points" class="font-display font-bold text-xs text-amber-400">0</span>
        </div>
        <div class="card-sub px-2 py-1 rounded-lg flex items-center gap-1 border-cyan-500/20">
          <span class="text-[9px] text-cyan-400">🔷</span>
          <span id="dock-shards" class="font-display font-bold text-xs text-cyan-300">0</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-1.5">
        <button type="button" onclick="openStatsDrawer()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] font-bold text-slate-200 flex items-center gap-1 cursor-pointer">
          <span>📊</span> Stats
        </button>
        <button type="button" onclick="exportBuildLink()" class="btn-primary px-3 py-1.5 rounded-lg text-slate-950 font-display font-bold text-[11px] cursor-pointer">
          Share
        </button>
      </div>

    </div>
  </div>

  <!-- Slide-Up Stats & Buffs Drawer -->
  <div id="drawer-backdrop" onclick="closeStatsDrawer()" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden"></div>
  <div id="stats-drawer" class="fixed bottom-0 inset-x-0 z-50 bg-slate-900 border-t border-slate-700 rounded-t-2xl p-3.5 max-w-lg mx-auto flex flex-col gap-2.5 max-h-[80vh]">
    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
      <div class="flex items-center gap-2">
        <span class="text-amber-400">⚡</span>
        <h3 class="font-display font-bold text-xs text-white uppercase tracking-wide">Active Tab Perks</h3>
      </div>
      <button type="button" onclick="closeStatsDrawer()" class="w-6 h-6 rounded bg-slate-800 text-slate-400 text-xs flex items-center justify-center cursor-pointer">✕</button>
    </div>

    <!-- Tier Breakdown -->
    <div class="grid grid-cols-3 gap-1.5 text-center">
      <div class="card-sub p-1.5 rounded">
        <div class="text-[8px] text-slate-500 font-bold uppercase">Tier 1</div>
        <div id="summary-t1" class="font-display font-bold text-xs text-emerald-400">0p</div>
      </div>
      <div class="card-sub p-1.5 rounded">
        <div class="text-[8px] text-slate-500 font-bold uppercase">Tier 2</div>
        <div id="summary-t2" class="font-display font-bold text-xs text-amber-400">0p</div>
      </div>
      <div class="card-sub p-1.5 rounded">
        <div class="text-[8px] text-slate-500 font-bold uppercase">Tier 3</div>
        <div id="summary-t3" class="font-display font-bold text-xs text-purple-400">0p</div>
      </div>
    </div>

    <!-- Active Buffs -->
    <div class="space-y-1">
      <span class="text-[9px] font-bold text-emerald-400 uppercase tracking-wider">▲ Buffs</span>
      <div id="buffs-list" class="max-h-36 overflow-y-auto space-y-1 pr-0.5 text-[11px]"></div>
    </div>

    <!-- Active Debuffs -->
    <div class="space-y-1">
      <span class="text-[9px] font-bold text-rose-400 uppercase tracking-wider">▼ Tradeoffs</span>
      <div id="debuffs-list" class="max-h-24 overflow-y-auto space-y-1 pr-0.5 text-[11px]"></div>
    </div>
  </div>

  <!-- Multi-Tab Presets Modal -->
  <div id="suggestions-modal" onclick="onModalBackdropClick(event)" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 p-2.5" style="display: none;">
    <div class="max-w-md w-full mx-auto my-auto card-glass border border-slate-700/80 rounded-xl p-3 shadow-2xl flex flex-col gap-2.5">
      <div class="flex items-center justify-between border-b border-slate-800 pb-1.5">
        <div class="flex items-center gap-1.5">
          <span class="text-lg">💡</span>
          <h3 class="font-display font-bold text-xs text-white">Recommended Builds</h3>
        </div>
        <button type="button" onclick="closeSuggestionsModal()" class="w-6 h-6 rounded bg-slate-800 text-slate-400 text-xs flex items-center justify-center cursor-pointer">✕</button>
      </div>

      <div id="modal-category-tabs" class="flex gap-1 overflow-x-auto pb-1 border-b border-slate-800/60 scrollbar-none"></div>
      <div id="suggestions-list" class="max-h-[50vh] overflow-y-auto space-y-1.5 pr-0.5"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-notification" class="fixed top-3 inset-x-0 mx-auto w-fit z-50 flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-900 border border-emerald-500/40 text-emerald-300 shadow-2xl text-xs font-semibold">
    <span>✓</span>
    <span id="toast-text">Build copied!</span>
  </div>

  <!-- Module Scripts -->
  <script src="skillsData.js"></script>
  <script src="suggestionsData.js"></script>
  <script src="calculator.js"></script>
  <script src="render.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
