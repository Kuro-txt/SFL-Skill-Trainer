<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sunflower Land — Skill Trainer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen flex flex-col p-2 sm:p-3 selection:bg-amber-400 selection:text-black">

  <div class="max-w-xl w-full mx-auto flex flex-col gap-2 flex-grow">
    
    <!-- Top Bar: Title & Global Counters -->
    <header class="card-glass rounded-xl p-2.5 flex flex-col gap-2">
      
      <!-- Top Row: Brand & Live Totals -->
      <div class="flex items-center justify-between gap-2 border-b border-slate-800/80 pb-2">
        <div class="flex items-center gap-1.5">
          <span class="text-xl">🌻</span>
          <div>
            <h1 class="font-display text-xs sm:text-sm font-bold text-white tracking-tight leading-none">SKILL TRAINER</h1>
            <span class="text-[9px] text-amber-400/80 font-medium">Sunflower Land</span>
          </div>
        </div>

        <!-- Total Investment Counters & Share -->
        <div class="flex items-center gap-1.5">
          <div class="card-sub px-2 py-1 rounded-lg flex items-center gap-1">
            <span class="text-[9px] text-slate-400 font-semibold uppercase">Total</span>
            <span id="hud-total-points" class="font-display font-bold text-xs text-amber-400">0 pts</span>
          </div>

          <div class="card-sub px-2 py-1 rounded-lg flex items-center gap-1 border-cyan-500/20">
            <span class="text-cyan-400 text-xs">🔷</span>
            <span id="hud-total-shards" class="font-display font-bold text-xs text-cyan-300">0</span>
          </div>

          <button type="button" onclick="exportBuildLink()" class="btn-primary px-2.5 py-1 rounded-lg text-slate-950 font-display font-bold text-[11px] cursor-pointer whitespace-nowrap shadow">
            Share
          </button>
        </div>
      </div>

      <!-- Bottom Row: Farm Sync & Actions -->
      <div class="flex items-center justify-between gap-1.5">
        <form onsubmit="fetchFarmSkills(event)" class="flex items-center bg-slate-900 rounded-lg border border-slate-700/80 p-0.5 flex-grow max-w-[170px]">
          <span class="pl-1.5 text-slate-500 text-[10px]">#</span>
          <input 
            id="farm-id-input" 
            type="number" 
            placeholder="Farm ID" 
            class="w-full px-1 py-0.5 bg-transparent text-xs text-white placeholder-slate-500 focus:outline-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
            required 
          />
          <button id="fetch-btn" type="submit" class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-bold text-[10px] whitespace-nowrap">
            Sync
          </button>
        </form>

        <div class="flex items-center gap-1">
          <button type="button" onclick="openSuggestionsModal()" class="px-2.5 py-1 rounded-lg bg-amber-500/10 border border-amber-500/30 text-[10px] font-bold text-amber-300 whitespace-nowrap">
            💡 Presets
          </button>

          <button type="button" onclick="resetCurrentCategory()" class="px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700 text-[10px] font-medium text-slate-300">
            Reset
          </button>
        </div>
      </div>

    </header>

    <!-- Category Pill Carousel -->
    <nav id="category-tabs" class="flex gap-1 overflow-x-auto pb-0.5 scrollbar-none"></nav>

    <!-- Zero-Scroll Tier Segment Selector -->
    <div class="card-sub p-1 rounded-xl flex items-center justify-between gap-1">
      <div class="flex gap-1 flex-grow">
        <button type="button" onclick="setTierTab(1)" id="tier-tab-1" class="flex-1 py-1.5 rounded-lg text-[10px] font-bold transition">
          Tier 1
        </button>
        <button type="button" onclick="setTierTab(2)" id="tier-tab-2" class="flex-1 py-1.5 rounded-lg text-[10px] font-bold transition">
          Tier 2
        </button>
        <button type="button" onclick="setTierTab(3)" id="tier-tab-3" class="flex-1 py-1.5 rounded-lg text-[10px] font-bold transition">
          Tier 3
        </button>
        <button type="button" onclick="setTierTab('stats')" id="tier-tab-stats" class="px-3 py-1.5 rounded-lg text-[10px] font-bold transition">
          📊 Stats
        </button>
      </div>
    </div>

    <!-- Active Tier View Container -->
    <main class="card-glass rounded-xl p-2 flex-grow flex flex-col justify-between min-h-[380px]">
      
      <!-- Tier Status / Progress Bar Header -->
      <div id="tier-header-box" class="flex flex-col gap-1 pb-1.5 border-b border-slate-800/80 mb-1.5">
        <div class="flex items-center justify-between">
          <span id="tier-title-badge" class="text-[10px] font-pixel text-amber-400">TIER 1</span>
          <span id="tier-status-text" class="text-[9px] font-pixel text-slate-400">UNLOCKED</span>
        </div>
        <div id="tier-progress-container" class="w-full h-1 rounded-full bg-slate-900 overflow-hidden hidden">
          <div id="tier-progress-bar" class="h-full bg-amber-400 transition-all duration-200" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Skills List View -->
      <div id="skills-list-container" class="space-y-1.5 overflow-y-auto max-h-[360px] pr-0.5"></div>

      <!-- Stats Summary View (Shown when Stats tab is active) -->
      <div id="stats-view-container" class="space-y-2 hidden">
        <div class="grid grid-cols-3 gap-1 text-center">
          <div class="card-sub p-1.5 rounded-lg">
            <div class="text-[8px] text-slate-500 font-bold uppercase">T1 PTS</div>
            <div id="summary-t1" class="font-display font-bold text-xs text-emerald-400">0p</div>
          </div>
          <div class="card-sub p-1.5 rounded-lg">
            <div class="text-[8px] text-slate-500 font-bold uppercase">T2 PTS</div>
            <div id="summary-t2" class="font-display font-bold text-xs text-amber-400">0p</div>
          </div>
          <div class="card-sub p-1.5 rounded-lg">
            <div class="text-[8px] text-slate-500 font-bold uppercase">T3 PTS</div>
            <div id="summary-t3" class="font-display font-bold text-xs text-purple-400">0p</div>
          </div>
        </div>

        <div>
          <span class="text-[9px] font-bold text-emerald-400 uppercase tracking-wider block mb-1">▲ Active Buffs</span>
          <div id="buffs-list" class="space-y-1 max-h-32 overflow-y-auto pr-0.5 text-xs"></div>
        </div>

        <div>
          <span class="text-[9px] font-bold text-rose-400 uppercase tracking-wider block mb-1">▼ Tradeoffs</span>
          <div id="debuffs-list" class="space-y-1 max-h-24 overflow-y-auto pr-0.5 text-xs"></div>
        </div>
      </div>

    </main>
  </div>

  <!-- Presets Modal -->
  <div id="suggestions-modal" onclick="onModalBackdropClick(event)" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 p-2.5" style="display: none;">
    <div class="max-w-md w-full mx-auto my-auto card-glass border border-slate-700/80 rounded-xl p-3 shadow-2xl flex flex-col gap-2">
      <div class="flex items-center justify-between border-b border-slate-800 pb-1.5">
        <h3 class="font-display font-bold text-xs text-white">Recommended Builds</h3>
        <button type="button" onclick="closeSuggestionsModal()" class="w-6 h-6 rounded bg-slate-800 text-slate-400 text-xs flex items-center justify-center cursor-pointer">✕</button>
      </div>
      <div id="modal-category-tabs" class="flex gap-1 overflow-x-auto pb-1 border-b border-slate-800/60 scrollbar-none"></div>
      <div id="suggestions-list" class="max-h-[50vh] overflow-y-auto space-y-1.5 pr-0.5"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-notification" class="fixed top-3 inset-x-0 mx-auto w-fit z-50 flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-900 border border-emerald-500/40 text-emerald-300 shadow-2xl text-xs font-semibold">
    <span>✓</span>
    <span id="toast-text">Build copied!</span>
  </div>

  <!-- Scripts -->
  <script src="skillsData.js"></script>
  <script src="suggestionsData.js"></script>
  <script src="calculator.js"></script>
  <script src="render.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
