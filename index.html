<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunflower Land Skill Trainer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="p-3 md:p-6 min-h-screen flex justify-center items-start">

  <!-- Main SFL Game Modal -->
  <div class="sfl-box rounded-xl max-w-6xl w-full p-4 md:p-6 flex flex-col gap-4">
    
    <!-- Top Header & Points HUD -->
    <div class="flex flex-wrap items-center justify-between gap-3 border-b-4 border-[#7c4822] pb-3">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🌻</span>
        <div>
          <h1 class="font-pixel text-xs sm:text-sm text-yellow-100 drop-shadow-[0_2px_0_#4b2813]">
            SKILL TREE TRAINER
          </h1>
          <span class="text-xs font-semibold text-amber-950/80">Sunflower Land Planner</span>
        </div>
      </div>

      <div class="flex items-center gap-3 flex-wrap">
        <div class="sfl-inner-box px-3 py-1.5 rounded flex items-center gap-2">
          <span class="font-pixel text-[9px] text-amber-900">POINTS:</span>
          <span id="hud-total-points" class="font-pixel text-[10px] text-emerald-800 font-bold">0 PTS</span>
        </div>

        <button onclick="resetCurrentCategory()" class="sfl-btn px-3 py-1.5 rounded font-pixel text-[9px] text-amber-950">
          RESET TAB
        </button>

        <button onclick="resetAllSkills()" class="sfl-btn sfl-btn-danger px-3 py-1.5 rounded font-pixel text-[9px] text-white">
          RESET ALL
        </button>
      </div>
    </div>

    <!-- Category Tabs -->
    <div id="category-tabs" class="flex gap-1.5 overflow-x-auto pb-1"></div>

    <!-- Workspace: Tiers (Left) & Compact Summary (Right) -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 items-start">
      
      <!-- Skill Matrix (2 Columns) -->
      <div class="lg:col-span-2 flex flex-col gap-3">
        
        <!-- Tier 1 -->
        <div class="sfl-inner-box p-3 rounded">
          <div class="flex justify-between items-center mb-2 pb-1 border-b-2 border-amber-900/20">
            <span class="font-pixel text-[10px] text-amber-950">TIER 1 (0 Req)</span>
            <span id="tier-1-count" class="font-pixel text-[9px] text-amber-800">0 pts</span>
          </div>
          <div id="tier-1-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
        </div>

        <!-- Tier 2 -->
        <div class="sfl-inner-box p-3 rounded">
          <div class="flex justify-between items-center mb-2 pb-1 border-b-2 border-amber-900/20">
            <span id="tier-2-header" class="font-pixel text-[10px] text-amber-950">TIER 2</span>
            <span id="tier-2-count" class="font-pixel text-[9px] text-amber-800">0 pts</span>
          </div>
          <div id="tier-2-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
        </div>

        <!-- Tier 3 -->
        <div class="sfl-inner-box p-3 rounded">
          <div class="flex justify-between items-center mb-2 pb-1 border-b-2 border-amber-900/20">
            <span id="tier-3-header" class="font-pixel text-[10px] text-amber-950">TIER 3</span>
            <span id="tier-3-count" class="font-pixel text-[9px] text-amber-800">0 pts</span>
          </div>
          <div id="tier-3-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
        </div>

      </div>

      <!-- Compact Sidebar Summary (1 Column) -->
      <div class="sfl-inner-box p-3 rounded flex flex-col gap-3">
        <h2 class="font-pixel text-[10px] text-amber-950 border-b-2 border-amber-900/20 pb-1">
          ACTIVE STATS
        </h2>

        <!-- Buffs -->
        <div>
          <span class="font-pixel text-[8px] text-emerald-800 uppercase block mb-1">Buffs</span>
          <div id="buffs-list" class="max-h-48 overflow-y-auto space-y-1 pr-1 text-xs"></div>
        </div>

        <!-- Debuffs -->
        <div>
          <span class="font-pixel text-[8px] text-rose-800 uppercase block mb-1">Tradeoffs / Debuffs</span>
          <div id="debuffs-list" class="max-h-36 overflow-y-auto space-y-1 pr-1 text-xs"></div>
        </div>

        <!-- Share Build Button -->
        <div class="pt-2 border-t-2 border-amber-900/20">
          <button onclick="exportBuildLink()" class="sfl-btn w-full py-2 rounded font-pixel text-[9px] text-amber-950">
            SHARE BUILD LINK
          </button>
          <div id="toast-msg" class="text-center font-pixel text-[8px] text-emerald-900 mt-1 opacity-0 transition-opacity">
            COPIED TO CLIPBOARD!
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="skillsData.js"></script>
  <script src="app.js"></script>
</body>
</html>
